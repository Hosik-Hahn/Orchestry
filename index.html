<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>세계의 소리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/globe.gl@2.46.2/dist/globe.gl.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --space:#04060F; --ink:#F4F6FF; --mute:#AEB6D6; --line:rgba(244,246,255,.16);
  --card:rgba(10,14,34,.72); --card2:rgba(26,32,70,.9);
  --font:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
/* 우주 배경이라 밝은 모드에서도 어두운 색을 유지해요 */
:root[data-theme="light"],:root[data-theme="dark"]{ --space:#04060F; }
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--space);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

#globe{position:absolute;inset:0}
header{position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;padding:22px 28px;pointer-events:none;z-index:3;
  background:linear-gradient(to bottom, rgba(4,6,15,.75), transparent)}
header h1{margin:0;font-size:clamp(22px,3vw,38px);font-weight:800;letter-spacing:-.03em;text-shadow:0 2px 20px rgba(0,0,0,.6)}
header p{margin:6px 0 0;color:var(--mute);font-size:clamp(13px,1.3vw,16px)}

.pin{position:relative;width:0;height:0;border:0;background:none;padding:0;pointer-events:auto}
.pin .dot{position:absolute;left:-9px;top:-9px;width:18px;height:18px;border-radius:50%;background:var(--c);
  box-shadow:0 0 0 3px rgba(4,6,15,.6),0 0 18px var(--c);transition:transform .25s}
.pin .ring{position:absolute;left:-9px;top:-9px;width:18px;height:18px;border-radius:50%;border:2px solid var(--c);opacity:0;pointer-events:none}
.pin .lbl{position:absolute;white-space:nowrap;font-weight:800;font-size:clamp(12px,1.2vw,15px);padding:4px 10px;border-radius:999px;
  background:var(--card);border:1px solid var(--line);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:background .25s,color .25s;top:-14px;left:16px}
.pin.left .lbl{left:auto;right:16px}
.pin.below .lbl{left:50%;top:14px;transform:translateX(-50%)}
.pin.above .lbl{left:50%;top:-44px;transform:translateX(-50%)}
.pin:hover .dot,.pin:focus-visible .dot{transform:scale(1.35)}
.pin.on .dot{transform:scale(1.5)}
.pin.on .lbl{background:var(--c);color:#0B0E22;border-color:transparent}
.pin.on .ring{animation:ripple 1.8s ease-out infinite}
.pin.on .ring.r2{animation-delay:.6s}
.pin.on .ring.r3{animation-delay:1.2s}
@keyframes ripple{0%{transform:scale(1);opacity:.9}100%{transform:scale(5);opacity:0}}
body.placing #globe{cursor:crosshair}
body.placing .pin{pointer-events:none}

.hint{position:absolute;left:28px;bottom:calc(24px + env(safe-area-inset-bottom,0px));font-size:12.5px;color:var(--mute);z-index:3;pointer-events:none}

#qr{position:absolute;right:24px;bottom:calc(24px + env(safe-area-inset-bottom,0px));background:#fff;color:#0B0E22;border-radius:16px;padding:12px;z-index:3;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#qrbox img,#qrbox canvas{width:132px!important;height:132px!important;display:block}
#qr p{margin:8px 0 0;font-weight:800;font-size:13px}

#now{position:absolute;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;
  width:min(460px,calc(100% - 32px));background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px 14px 20px;
  display:flex;align-items:center;gap:14px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:opacity .3s,transform .3s;z-index:4}
#now.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#now .sw{width:14px;height:14px;border-radius:50%;background:var(--c);flex:none;box-shadow:0 0 12px var(--c)}
#now .info{flex:1;min-width:0}
#now .t{font-weight:800;font-size:17px}
#now .bar{height:4px;border-radius:4px;background:var(--line);margin-top:8px;overflow:hidden}
#now .bar i{display:block;height:100%;width:0;background:var(--c)}
#now .time{font-size:12px;color:var(--mute);margin-top:5px;font-variant-numeric:tabular-nums}
#now button{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;flex:none}
#now button:hover{background:var(--card2)}

#toast{position:absolute;left:50%;top:calc(96px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:#FFB400;color:#0B0E22;font-weight:600;
  padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);text-align:center;opacity:0;transition:opacity .3s;pointer-events:none;z-index:7}
#toast.show{opacity:1}
#loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);z-index:1;pointer-events:none}

#adminBtn{position:absolute;top:calc(22px + env(safe-area-inset-top,0px));right:24px;z-index:4;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:9px 18px;font-weight:600;font-size:14px;backdrop-filter:blur(6px)}
#adminBtn:hover{background:var(--card2)}
#panel{position:absolute;top:0;right:0;bottom:0;width:min(440px,100%);background:#0A0E22;border-left:1px solid var(--line);z-index:6;
  transform:translateX(105%);transition:transform .3s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#panel.open{transform:none}
#panel .ph{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
#panel .ph h2{margin:0;font-size:19px}
#panel .pb{flex:1;overflow:auto;padding:16px 20px 30px}
.pbtn{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;font-weight:600;font-size:13px}
.pbtn:hover{background:var(--card2)}
.pbtn.primary{background:var(--ink);color:#0A0E22;border-color:var(--ink)}
.pbtn.danger{color:#FF6B68;border-color:rgba(255,107,104,.5)}
.fld{display:block;margin-bottom:12px}
.fld span{display:block;font-size:12px;color:var(--mute);font-weight:600;margin-bottom:5px}
.fld input,.rg input[type=text],.rg select{width:100%;padding:9px 11px;border-radius:10px;border:1.5px solid var(--line);background:#141A3A;color:var(--ink);font:inherit;font-size:14px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;margin:4px 0 8px}
.sec{font-size:13px;font-weight:800;color:var(--mute);margin:22px 0 10px;display:flex;justify-content:space-between;align-items:center}
.rg{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:#11163A}
.rg .top{display:flex;gap:8px;align-items:center}
.rg input[type=color]{width:34px;height:34px;border:0;border-radius:50%;padding:0;background:none;flex:none;cursor:pointer}
.rg input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.rg input[type=color]::-webkit-color-swatch{border:none;border-radius:50%}
.rg .top input[type=text]{flex:1}
.rg .top select{width:auto;flex:none}
.rg .file{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px}
.rg .file .fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mute)}
.rg .file .fn.ok{color:var(--ink)}
.rg .gh{font-size:12px;color:var(--mute);margin-top:6px}
.rg .gh code{color:var(--ink)}
.rg .acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.note{font-size:12.5px;color:var(--mute);line-height:1.65;margin:14px 0 0}
.box{border:1px dashed var(--line);border-radius:14px;padding:14px;margin-top:22px}
.box h3{margin:0 0 6px;font-size:14px}

body.viewer #adminBtn, body.viewer #qr, body.viewer #panel{display:none!important}
@media (max-width:720px){
  .hint{display:none}
  #qr{display:none}
  .pin .lbl{font-size:12px}
}
@media (prefers-reduced-motion:reduce){.pin.on .ring{animation:none;opacity:.6;transform:scale(2)}}
</style>
</head>
<body>
<div id="loading">지구본을 불러오는 중…</div>
<div id="globe" aria-label="회전할 수 있는 3D 지구본"></div>
<header>
  <h1 id="title"></h1>
  <p id="sub"></p>
</header>
<button id="adminBtn">관리</button>
<div class="hint">드래그해서 돌리기 · 휠로 확대/축소</div>
<div id="qr"><div id="qrbox"></div><p>QR로 함께 듣기</p></div>

<div id="now" aria-live="polite">
  <span class="sw"></span>
  <div class="info"><div class="t"></div><div class="bar"><i></i></div><div class="time"></div></div>
  <button id="pauseBtn">일시정지</button>
  <button id="stopBtn">정지</button>
</div>
<div id="toast" role="status"></div>

<aside id="panel" aria-label="관리">
  <div class="ph"><h2>관리</h2><button class="pbtn" id="closePanel">닫기</button></div>
  <div class="pb">
    <label class="fld"><span>제목</span><input id="fTitle" maxlength="60"></label>
    <label class="fld"><span>안내 문구</span><input id="fSub" maxlength="120"></label>
    <label class="chk"><input type="checkbox" id="fLoop"> 곡이 끝나면 반복 재생</label>
    <label class="chk"><input type="checkbox" id="fSpin"> 가만히 두면 지구본이 천천히 회전</label>
    <div class="sec"><span id="cnt">지역</span><button class="pbtn primary" id="addRegion">+ 지역 추가</button></div>
    <div id="list"></div>
    <p class="note">여기서 넣은 음원은 이 컴퓨터의 브라우저에만 저장돼요. <span id="usage"></span></p>
    <div class="box">
      <h3>QR로 들어온 관객 화면에 반영하기</h3>
      <p class="note" style="margin:0 0 10px">관객 휴대폰에는 GitHub에 올린 내용만 보여요. 지역 이름·위치를 바꿨다면 아래 파일을 받아 GitHub에 함께 올리고, 음원은 각 지역에 적힌 이름으로 <code>audio</code> 폴더에 올려 주세요.</p>
      <button class="pbtn" id="exportBtn">regions.json 받기</button>
    </div>
  </div>
</aside>

<script>
/* ---------- 기본값 (regions.json이 없을 때 쓰여요) ---------- */
const DEFAULTS = {
  title: "세계의 소리",
  subtitle: "지구본을 돌려 지역을 누르면 그곳의 음악이 흘러나옵니다",
  loop: false,
  autoRotate: true,
  regions: [
    { id:"mongolia", name:"몽골",       lon: 103.8, lat: 46.9,  label:"right", color:"#FFB400" },
    { id:"scotland", name:"스코틀랜드", lon:  -4.2, lat: 56.8,  label:"left",  color:"#5FD4F4" },
    { id:"mexico",   name:"멕시코",     lon:-102.5, lat: 23.6,  label:"left",  color:"#FF8A3D" },
    { id:"france",   name:"프랑스",     lon:   2.2, lat: 46.6,  label:"left",  color:"#3D9BFF" },
    { id:"africa",   name:"아프리카",   lon:  20.0, lat:  3.0,  label:"right", color:"#FF5E5B" },
    { id:"greece",   name:"그리스",     lon:  22.0, lat: 39.1,  label:"below", color:"#8C8CFF" },
    { id:"hawaii",   name:"하와이",     lon:-156.5, lat: 20.3,  label:"below", color:"#2EC27E" },
    { id:"brazil",   name:"브라질",     lon: -51.9, lat:-10.3,  label:"right", color:"#9BE15D" },
    { id:"india",    name:"인도",       lon:  78.9, lat: 21.0,  label:"right", color:"#FF8FC7" },
    { id:"turkey",   name:"터키",       lon:  35.2, lat: 39.0,  label:"right", color:"#F2E14C" },
    { id:"usa",      name:"미국",       lon: -98.5, lat: 39.5,  label:"right", color:"#C86BFA" }
  ]
};
const FADE = 0.8;
const PALETTE = ["#FFB400","#5FD4F4","#FF8A3D","#3D9BFF","#FF5E5B","#8C8CFF","#2EC27E","#9BE15D","#FF8FC7","#F2E14C","#C86BFA","#00C2A8"];
const TEX = "https://cdn.jsdelivr.net/npm/three-globe@2.45.2/example/img/";

/* QR로 들어온 사람은 주소에 ?view 가 붙어 있어요 → 보기·듣기만 가능 */
const VIEWER = new URLSearchParams(location.search).has("view");
if (VIEWER) document.body.classList.add("viewer");

const $ = id => document.getElementById(id);
let state = structuredClone(DEFAULTS);
const fileNames = {}, urls = {};
const repoFile = id => `audio/${id}.mp3`;

/* ---------- 브라우저 저장소 (진행자 컴퓨터 전용) ---------- */
const store = {
  db: null,
  open(){
    return new Promise((res, rej)=>{
      const r = indexedDB.open("world-sounds", 1);
      r.onupgradeneeded = ()=>{ r.result.createObjectStore("kv"); r.result.createObjectStore("audio"); };
      r.onsuccess = ()=>{ this.db = r.result; res(); };
      r.onerror = ()=> rej(r.error);
    });
  },
  req(name, mode, fn){
    return new Promise((res, rej)=>{
      if (!this.db) return rej(new Error("no db"));
      const tx = this.db.transaction(name, mode), r = fn(tx.objectStore(name));
      tx.oncomplete = ()=> res(r && r.result);
      tx.onerror = ()=> rej(tx.error); tx.onabort = ()=> rej(tx.error);
    });
  },
  get(n,k){ return this.req(n,"readonly",s=>s.get(k)); },
  put(n,k,v){ return this.req(n,"readwrite",s=>s.put(v,k)); },
  del(n,k){ return this.req(n,"readwrite",s=>s.delete(k)); },
  keys(n){ return this.req(n,"readonly",s=>s.getAllKeys()); }
};
let saveTimer;
function saveState(){ if (VIEWER) return; clearTimeout(saveTimer); saveTimer = setTimeout(()=> store.put("kv","state",state).catch(()=> toast("설정을 저장하지 못했어요")), 250); }

/* ---------- 3D 지구본 ---------- */
let globe, idleTimer;
function initGlobe(){
  globe = Globe({ animateIn: true })($("globe"))
    .globeImageUrl(TEX + "earth-blue-marble.jpg")
    .bumpImageUrl(TEX + "earth-topology.png")
    .backgroundImageUrl(TEX + "night-sky.png")
    .showAtmosphere(true).atmosphereColor("#7EC8FF").atmosphereAltitude(.2)
    .htmlElementsData([])
    .htmlLat("lat").htmlLng("lon").htmlAltitude(.01)
    .htmlTransitionDuration(0)
    .htmlElement(r => pinEl(r))
    .onGlobeClick(({lat, lng}) => { if (placing) placeAt(lat, lng); })
    .onGlobeReady(()=> $("loading").remove());
  const c = globe.controls();
  c.autoRotateSpeed = .35; c.enableDamping = true; c.minDistance = 130; c.maxDistance = 600;
  c.addEventListener("start", ()=>{ c.autoRotate = false; clearTimeout(idleTimer); });
  c.addEventListener("end", scheduleSpin);
  globe.pointOfView({ lat: 25, lng: 20, altitude: 2.3 });
  fit(); addEventListener("resize", fit);
  scheduleSpin();
}
function fit(){ globe.width(innerWidth).height(innerHeight); }
function scheduleSpin(){
  clearTimeout(idleTimer);
  idleTimer = setTimeout(()=>{
    const c = globe.controls();
    c.autoRotate = state.autoRotate !== false && !current && !placing && !matchMedia("(prefers-reduced-motion: reduce)").matches;
  }, 5000);
}
function focusOn(r){
  const c = globe.controls(); c.autoRotate = false; clearTimeout(idleTimer);
  const alt = Math.min(globe.pointOfView().altitude, 2);
  globe.pointOfView({ lat: r.lat, lng: r.lon, altitude: alt }, 1200);
}

/* ---------- 핀 ---------- */
const pinEls = {};
function pinEl(r){
  const b = document.createElement("button");
  b.className = "pin " + (r.label || "right");
  b.style.setProperty("--c", r.color);
  b.setAttribute("aria-label", `${r.name} 음악 재생`);
  b.innerHTML = `<span class="ring"></span><span class="ring r2"></span><span class="ring r3"></span><span class="dot"></span><span class="lbl"></span>`;
  b.querySelector(".lbl").textContent = r.name;
  b.addEventListener("pointerdown", e=> e.stopPropagation());
  b.onclick = e=>{ e.stopPropagation(); toggle(r.id); };
  if (r.id === current) b.classList.add("on");
  pinEls[r.id] = b;
  return b;
}
function buildPins(){ if (globe) globe.htmlElementsData(state.regions.map(r=>({...r}))); }

/* ---------- 재생 ---------- */
const players = {};
let current = null;
const fades = new Map();
function srcFor(id){ return urls[id] || repoFile(id); }
function player(id){
  if (!players[id]){
    const a = new Audio(); a.preload = "auto";
    a.addEventListener("ended", ()=>{ if (current === id) endCurrent(); });
    players[id] = a;
  }
  const a = players[id], want = new URL(srcFor(id), location.href).href;
  if (a.src !== want) a.src = want;
  a.loop = !!state.loop;
  return a;
}
function fadeTo(a, target, secs, done){
  cancelAnimationFrame(fades.get(a));
  const from = a.volume, t0 = performance.now(), dur = Math.max(1, secs*1000);
  const tick = now=>{
    const k = Math.min(1, (now - t0)/dur);
    a.volume = from + (target - from) * k;
    if (k < 1) fades.set(a, requestAnimationFrame(tick)); else { fades.delete(a); done && done(); }
  };
  fades.set(a, requestAnimationFrame(tick));
}
function stopOne(id){
  const a = players[id]; pinEls[id]?.classList.remove("on");
  if (a) fadeTo(a, 0, FADE, ()=>{ a.pause(); a.currentTime = 0; });
}
function endCurrent(){ if (current) pinEls[current]?.classList.remove("on"); current = null; $("now").classList.remove("show"); scheduleSpin(); }
async function toggle(id){
  if (current === id){ stopAll(); return; }
  const r = state.regions.find(x=>x.id===id); if (!r) return;
  if (current) stopOne(current);
  current = id;
  focusOn(r);
  const a = player(id);
  pinEls[id]?.classList.add("on");
  a.volume = 0; a.currentTime = 0;
  try { await a.play(); fadeTo(a, 1, FADE); showNow(r); }
  catch(e){
    if (current !== id) return;
    endCurrent();
    toast(VIEWER ? `‘${r.name}’ 음악이 아직 준비되지 않았어요` : `‘${r.name}’ 음원이 없어요. 관리에서 넣어 주세요.`);
  }
}
function stopAll(){ if (current) stopOne(current); endCurrent(); }
function showNow(r){
  const n = $("now");
  n.style.setProperty("--c", r.color);
  n.querySelector(".t").textContent = r.name;
  $("pauseBtn").textContent = "일시정지";
  n.classList.add("show");
}
const fmt = s => isFinite(s) ? `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}` : "0:00";
setInterval(()=>{
  if (!current) return;
  const a = players[current];
  $("now").querySelector(".bar i").style.width = a.duration ? (a.currentTime/a.duration*100) + "%" : "0%";
  $("now").querySelector(".time").textContent = `${fmt(a.currentTime)} / ${fmt(a.duration)}`;
}, 250);
$("pauseBtn").onclick = ()=>{
  if (!current) return;
  const a = players[current];
  if (a.paused){ a.play(); pinEls[current]?.classList.add("on"); $("pauseBtn").textContent = "일시정지"; }
  else { a.pause(); pinEls[current]?.classList.remove("on"); $("pauseBtn").textContent = "계속"; }
};
$("stopBtn").onclick = stopAll;

let toastTimer;
function toast(t){
  const el = $("toast"); el.textContent = t; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(()=> el.classList.remove("show"), 3500);
}
function renderHeader(){ $("title").textContent = state.title; $("sub").textContent = state.subtitle; document.title = state.title; }

/* ---------- QR (관객용 주소 = 지금 주소 + ?view) ---------- */
function renderQR(){
  if (VIEWER || !window.QRCode) return;
  const link = location.origin + location.pathname + "?view";
  $("qrbox").innerHTML = "";
  new QRCode($("qrbox"), { text: link, width: 264, height: 264, colorDark:"#0B0E22", colorLight:"#ffffff", correctLevel: QRCode.CorrectLevel.M });
}

/* ---------- 관리 화면 (진행자만) ---------- */
function openPanel(){
  if (VIEWER) return;
  $("fTitle").value = state.title; $("fSub").value = state.subtitle;
  $("fLoop").checked = !!state.loop; $("fSpin").checked = state.autoRotate !== false;
  renderList(); $("panel").classList.add("open"); updateUsage();
}
function closePanel(){ $("panel").classList.remove("open"); }
$("adminBtn").onclick = openPanel;
$("closePanel").onclick = closePanel;
$("fTitle").oninput = e=>{ state.title = e.target.value; renderHeader(); saveState(); };
$("fSub").oninput = e=>{ state.subtitle = e.target.value; renderHeader(); saveState(); };
$("fLoop").onchange = e=>{ state.loop = e.target.checked; Object.values(players).forEach(a=> a.loop = state.loop); saveState(); };
$("fSpin").onchange = e=>{ state.autoRotate = e.target.checked; if (!e.target.checked) globe.controls().autoRotate = false; else scheduleSpin(); saveState(); };

function renderList(){
  $("cnt").textContent = `지역 ${state.regions.length}곳`;
  const list = $("list"); list.innerHTML = "";
  state.regions.forEach(r=>{
    const el = document.createElement("div"); el.className = "rg";
    el.innerHTML = `
      <div class="top">
        <input type="color" aria-label="색">
        <input type="text" maxlength="20" aria-label="지역 이름">
        <select aria-label="이름표 위치">
          <option value="right">이름 오른쪽</option><option value="left">이름 왼쪽</option>
          <option value="above">이름 위</option><option value="below">이름 아래</option>
        </select>
      </div>
      <div class="file"><span class="fn"></span>
        <label class="pbtn">음원 선택<input type="file" accept="audio/*" hidden></label>
      </div>
      <div class="gh">관객용 GitHub 파일 이름: <code></code></div>
      <div class="acts">
        <button class="pbtn" data-a="play">들어보기</button>
        <button class="pbtn" data-a="move">위치 옮기기</button>
        <button class="pbtn" data-a="clear">음원 지우기</button>
        <button class="pbtn danger" data-a="delete">지역 삭제</button>
      </div>`;
    const [color, name, label] = [el.querySelector("input[type=color]"), el.querySelector("input[type=text]"), el.querySelector("select")];
    color.value = r.color; name.value = r.name; label.value = r.label || "right";
    el.querySelector(".gh code").textContent = repoFile(r.id);
    const fn = el.querySelector(".fn");
    const setFn = ()=>{ fn.textContent = fileNames[r.id] ? "✓ " + fileNames[r.id] : "이 컴퓨터에 음원 없음"; fn.classList.toggle("ok", !!fileNames[r.id]); };
    setFn();
    color.onchange = ()=>{ r.color = color.value; buildPins(); saveState(); };
    name.oninput = ()=>{ r.name = name.value || "이름 없음"; const l = pinEls[r.id]?.querySelector(".lbl"); if (l) l.textContent = r.name; saveState(); };
    name.onchange = ()=> buildPins();
    label.onchange = ()=>{ r.label = label.value; buildPins(); saveState(); };
    el.querySelector("input[type=file]").onchange = async e=>{
      const f = e.target.files[0]; if (!f) return;
      fn.textContent = "저장하는 중…";
      try { await store.put("audio", r.id, { blob:f, name:f.name }); setUrl(r.id, f, f.name); setFn(); updateUsage(); }
      catch(err){ fn.textContent = "저장하지 못했어요 (용량 부족일 수 있어요)"; }
      e.target.value = "";
    };
    el.querySelector('[data-a="play"]').onclick = ()=> toggle(r.id);
    el.querySelector('[data-a="move"]').onclick = ()=> startPlacing(r.id);
    el.querySelector('[data-a="clear"]').onclick = async ()=>{
      if (current === r.id) stopAll();
      await store.del("audio", r.id).catch(()=>{});
      dropUrl(r.id); setFn(); updateUsage();
    };
    const del = el.querySelector('[data-a="delete"]');
    del.onclick = async ()=>{
      if (del.dataset.armed !== "1"){ del.dataset.armed = "1"; del.textContent = "한 번 더 누르면 삭제"; return; }
      if (current === r.id) stopAll();
      state.regions = state.regions.filter(x=> x.id !== r.id);
      await store.del("audio", r.id).catch(()=>{});
      dropUrl(r.id); buildPins(); renderList(); saveState(); updateUsage();
    };
    list.appendChild(el);
  });
}
$("addRegion").onclick = ()=>{
  const id = "region" + (Date.now() % 100000);
  const pov = globe.pointOfView();
  state.regions.push({ id, name:"새 지역", lon:+pov.lng.toFixed(2), lat:+pov.lat.toFixed(2), label:"right", color: PALETTE[state.regions.length % PALETTE.length] });
  buildPins(); renderList(); saveState();
  startPlacing(id);
};
$("exportBtn").onclick = ()=>{
  const blob = new Blob([JSON.stringify(state, null, 2)], { type:"application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "regions.json";
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=> URL.revokeObjectURL(a.href), 2000);
};

/* 지구본에서 위치 지정 */
let placing = null;
function startPlacing(id){
  placing = id; closePanel(); document.body.classList.add("placing");
  globe.controls().autoRotate = false; clearTimeout(idleTimer);
  toast(`지구본을 돌려서 ‘${state.regions.find(r=>r.id===id).name}’ 위치를 눌러 주세요 (취소: Esc)`);
}
function endPlacing(){ placing = null; document.body.classList.remove("placing"); openPanel(); scheduleSpin(); }
function placeAt(lat, lng){
  const r = state.regions.find(q=> q.id === placing); if (!r) return endPlacing();
  r.lon = +lng.toFixed(2); r.lat = +lat.toFixed(2);
  buildPins(); saveState(); endPlacing();
}
document.addEventListener("keydown", e=>{
  if (e.key !== "Escape") return;
  if (placing) endPlacing(); else if ($("panel").classList.contains("open")) closePanel(); else stopAll();
});

function setUrl(id, blob, name){
  dropUrl(id);
  urls[id] = URL.createObjectURL(blob); fileNames[id] = name;
}
function dropUrl(id){
  if (urls[id]) URL.revokeObjectURL(urls[id]);
  delete urls[id]; delete fileNames[id];
  if (players[id]){ players[id].pause(); players[id].removeAttribute("src"); delete players[id]; }
}
async function updateUsage(){
  try { const e = await navigator.storage.estimate(); $("usage").textContent = `현재 사용량 약 ${(e.usage/1048576).toFixed(1)}MB.`; } catch(err){}
}

/* ---------- 시작 ---------- */
(async function main(){
  // 1) GitHub에 올린 regions.json이 있으면 기본값으로 사용
  try {
    const res = await fetch("regions.json", { cache:"no-store" });
    if (res.ok){ const j = await res.json(); if (Array.isArray(j.regions)) state = { ...DEFAULTS, ...j }; }
  } catch(e){}
  // 2) 진행자 컴퓨터라면 이 브라우저에 저장된 설정과 음원을 우선 사용
  if (!VIEWER){
    try {
      await store.open();
      const saved = await store.get("kv","state");
      if (saved && Array.isArray(saved.regions)) state = saved;
      for (const k of await store.keys("audio")){
        const rec = await store.get("audio", k);
        if (rec && rec.blob) setUrl(k, rec.blob, rec.name);
      }
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
    } catch(e){ toast("이 브라우저에서는 음원을 저장할 수 없어요. 시크릿 창이 아닌 일반 창으로 열어 주세요."); }
  }
  renderHeader(); renderQR();
  if (typeof Globe !== "function"){ $("loading").textContent = "지구본을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요."; return; }
  initGlobe(); buildPins();
})();
</script>
